spring.application.name=EntregaContenerizacion
spring.datasource.url=jdbc:mysql://localhost:3306/entregaContenerizada?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=admin1234
spring.jpa.hibernate.ddl-auto=update


# Puerto donde corre la aplicación (y Swagger)
server.port=8080
# Ruta del Swagger UI (opcional)
springdoc.swagger-ui.path=/swagger
# Ruta del JSON OpenAPI (opcional)
springdoc.api-docs.path=/api-docs